<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin + Lucky Chest</title>

<style>
body{
background:#1b1b2f;
color:white;
font-family:Arial;
text-align:center;
margin-top:40px;
}

#coins{
font-size:35px;
margin:20px;
}

.coin, .chest, .gold-chest{
width:180px;
cursor:pointer;
transition:0.2s;
margin-top:30px;
}

/* Анимация прыжка монеты */
@keyframes jump {
  0%   { transform: translateY(0) scale(1); }
  50%  { transform: translateY(-30px) scale(1.3); }
  100% { transform: translateY(0) scale(1); }
}

.coin.jump {
  animation: jump 0.3s ease;
}

/* Анимация сундука */
@keyframes chestJump {
  0% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.1); }
  100% { transform: translateY(0) scale(1); }
}

.chest.jump, .gold-chest.jump {
  animation: chestJump 0.5s ease;
}
</style>
</head>

<body>

<h1>🪙 Tap Coin</h1>

<div id="coins">0</div>

<img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">

<!-- Обычный сундук -->
<img id="chest" class="chest" src="https://cdn-icons-png.flaticon.com/512/1046/1046750.png" style="display:none;">

<!-- Золотой редкий сундук -->
<img id="goldChest" class="gold-chest" src="https://cdn-icons-png.flaticon.com/512/1046/1046761.png" style="display:none;">

<script>
const serverUrl = "https://bot-game-1-686w.onrender.com";

// Генерация уникального игрока
let userId = localStorage.getItem("userId");
if(!userId){
    userId = (typeof Telegram !== "undefined" && Telegram.WebApp.initDataUnsafe?.user?.id) 
             ? Telegram.WebApp.initDataUnsafe.user.id.toString()
             : Math.random().toString(36).substring(2);
    localStorage.setItem("userId", userId);
}

const display = document.getElementById("coins");
const coin = document.querySelector(".coin");
const chest = document.getElementById("chest");
const goldChest = document.getElementById("goldChest");

// Загрузка монет с сервера
async function loadCoins(){
    try {
        const res = await fetch(`${serverUrl}/coins?userId=${userId}`);
        const data = await res.json();
        display.innerText = data.coins;
    } catch(e){
        console.error("Не удалось загрузить монеты", e);
        display.innerText = "0";
    }
}

// Добавление монет на сервер
async function addCoins(amount){
    try {
        const res = await fetch(`${serverUrl}/add`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({userId, amount})
        });
        const data = await res.json();
        display.innerText = data.coins;
    } catch(e){
        console.error("Не удалось добавить монеты", e);
    }
}

// Функция случайного появления сундука
function maybeShowChest(){
    if(Math.random() < 0.05 && chest.style.display === "none"){ // 5% шанс обычного
        chest.style.display = "block";
        chest.classList.add("jump");
        setTimeout(()=> chest.classList.remove("jump"), 500);
    }
    if(Math.random() < 0.01 && goldChest.style.display === "none"){ // 1% шанс золотого
        goldChest.style.display = "block";
        goldChest.classList.add("jump");
        setTimeout(()=> goldChest.classList.remove("jump"), 500);
    }
}

// Клик по монете с анимацией
coin.onclick = async () => {
    await addCoins(1);
    coin.classList.add("jump");
    setTimeout(()=> coin.classList.remove("jump"), 300);
    maybeShowChest();
}

// Клик по обычному сундуку
chest.onclick = async () => {
    const bonus = Math.floor(Math.random()*231) + 20; // 20-250 монет
    await addCoins(bonus);
    alert(`🎉 Поздравляем! Вы получили ${bonus} монет!`);
    chest.style.display = "none";
}

// Клик по золотому сундуку
goldChest.onclick = async () => {
    const bonus = Math.floor(Math.random()*501) + 500; // 500-1000 монет
    await addCoins(bonus);
    alert(`🌟 Вау! Вы нашли ЗОЛОТОЙ сундук и получили ${bonus} монет!`);
    goldChest.style.display = "none";
}

loadCoins();
</script>

</body>
</html>
