<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin</title>

<style>
body{
background:#1b1b2f;
color:white;
font-family:Arial;
text-align:center;
margin-top:20px;
}

#coins{
font-size:35px;
margin:20px;
}

input{
padding:6px;
border-radius:5px;
border:none;
}

button{
padding:6px 10px;
border-radius:5px;
border:none;
background:#f0a500;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.coin,.chest,.gold{
width:170px;
cursor:pointer;
margin-top:20px;
}

#game{
display:none;
}

#ready{
font-size:22px;
color:#00ff00;
margin:10px;
}
</style>
</head>

<body>

<h1>🪙 Tap Coin</h1>

<p>Ваш токен: <span id="token">нет</span></p>

<button id="getToken">Получить токен</button>

<br><br>

<input id="loadToken" placeholder="Вставьте токен">
<button id="loadBtn">Загрузить токен</button>

<br><br>

<button id="readyBtn">Готово</button>

<div id="ready"></div>

<div id="game">

<div id="coins">0</div>

<img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">

<img id="chest" class="chest" src="https://cdn-icons-png.flaticon.com/512/833/833314.png" style="display:none;">

<img id="gold" class="gold" src="https://cdn-icons-png.flaticon.com/512/833/833310.png" style="display:none;">

</div>

<script>

const server="https://tap-coin-server.onrender.com";

let token=null; // теперь токен не берётся автоматически

const tokenText=document.getElementById("token");
const coins=document.getElementById("coins");
const coin=document.querySelector(".coin");
const chest=document.getElementById("chest");
const gold=document.getElementById("gold");
const game=document.getElementById("game");
const ready=document.getElementById("ready");

// получить токен
document.getElementById("getToken").onclick=async()=>{

const newToken=Math.random().toString(36).substring(2,10);

const res=await fetch(server+"/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({token:newToken})
});

const data=await res.json();

token=data.token;

localStorage.setItem("token",token);

tokenText.innerText=token;

coins.innerText=data.coins;

}

// загрузить токен
document.getElementById("loadBtn").onclick=async()=>{

const t=document.getElementById("loadToken").value.trim();

if(!t)return alert("Введите токен");

token=t;

localStorage.setItem("token",token);

tokenText.innerText=token;

const res=await fetch(server+"/coins?token="+token);

const data=await res.json();

coins.innerText=data.coins;

}

// кнопка готово
document.getElementById("readyBtn").onclick=()=>{

if(!token || token===""){
alert("Сначала получите или загрузите токен!");
return;
}

ready.innerText="Готово ✅";

game.style.display="block";

}

async function addCoins(amount){

if(!token)return;

const res=await fetch(server+"/add",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({token,amount})
});

const data=await res.json();

coins.innerText=data.coins;

}

function maybeChest(){

if(Math.random()<0.05){
chest.style.display="block";
}

if(Math.random()<0.01){
gold.style.display="block";
}

}

coin.onclick=async()=>{

await addCoins(1);

maybeChest();

}

chest.onclick=async()=>{

const bonus=Math.floor(Math.random()*231)+20;

await addCoins(bonus);

alert("🎉 Вы получили "+bonus+" монет");

chest.style.display="none";

}

gold.onclick=async()=>{

const bonus=Math.floor(Math.random()*501)+500;

await addCoins(bonus);

alert("🌟 ЗОЛОТОЙ сундук! "+bonus+" монет");

gold.style.display="none";

}

</script>

</body>
</html>
