<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin + Lucky Chest</title>
<style>
body{
  background:#1b1b2f;
  color:white;
  font-family:Arial;
  text-align:center;
  margin-top:20px;
}
#coins{font-size:35px;margin:20px;}
input{
  padding:6px;
  border-radius:5px;
  border:none;
}
button{
  padding:6px 10px;
  border-radius:5px;
  border:none;
  background:#f0a500;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}
#game{display:none;}
#ready{font-size:22px;color:#00ff00;margin:10px;}
.coin,.chest,.gold{
  width:170px;
  cursor:pointer;
  margin-top:20px;
  transition:0.2s;
}
</style>
</head>
<body>

<h1>🪙 Tap Coin</h1>

<p>Ваш токен: <span id="token">нет</span></p>
<button id="getToken">Получить токен</button>
<br><br>
<input id="loadToken" placeholder="Вставьте токен">
<button id="loadBtn">Загрузить токен</button>
<br><br>
<button id="readyBtn">Готово</button>
<div id="ready"></div>

<div id="game">
  <div id="coins">0</div>
  <img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">
  <img id="chest" class="chest" src="https://i.ibb.co/0F8ZK1P/chest.png" style="display:none;">
  <img id="gold" class="gold" src="https://i.ibb.co/yYVYw3D/gold-chest.png" style="display:none;">
  <br>
  <button id="leaderBtn">Показать лидерборд</button>
  <pre id="leaderboard"></pre>
</div>

<script>
const server="https://tap-coin-server.onrender.com"; // твой сервер
let token=null;

const tokenText=document.getElementById("token");
const coins=document.getElementById("coins");
const coin=document.querySelector(".coin");
const chest=document.getElementById("chest");
const gold=document.getElementById("gold");
const game=document.getElementById("game");
const ready=document.getElementById("ready");
const leaderBtn=document.getElementById("leaderBtn");
const leaderboard=document.getElementById("leaderboard");

// Получить токен
document.getElementById("getToken").onclick=async()=>{
  const newToken=Math.random().toString(36).substring(2,10);
  const res=await fetch(server+"/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token:newToken})
  });
  const data=await res.json();
  token=data.token;
  localStorage.setItem("token",token);
  tokenText.innerText=token;
  coins.innerText=data.coins;
}

// Загрузить токен
document.getElementById("loadBtn").onclick=async()=>{
  const t=document.getElementById("loadToken").value.trim();
  if(!t) return alert("Введите токен");
  token=t;
  localStorage.setItem("token",token);
  tokenText.innerText=token;
  const res=await fetch(server+"/coins?token="+token);
  const data=await res.json();
  coins.innerText=data.coins;
}

// Кнопка готово
document.getElementById("readyBtn").onclick=()=>{
  if(!token){ alert("Сначала получите или загрузите токен!"); return;}
  ready.innerText="Готово ✅";
  game.style.display="block";
}

// Добавление монет
async function addCoins(amount){
  if(!token) return;
  const res=await fetch(server+"/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token,amount})
  });
  const data=await res.json();
  coins.innerText=data.coins;
}

// Появление сундука
function maybeChest(){
  if(Math.random()<0.05) chest.style.display="block";
  if(Math.random()<0.01) gold.style.display="block";
}

// Клик по монете
coin.onclick=async()=>{
  await addCoins(1);
  maybeChest();
}

// Клик по обычному сундуку
chest.onclick=async()=>{
  const bonus=Math.floor(Math.random()*231)+20;
  await addCoins(bonus);
  alert("🎉 Вы открыли обычный сундук и получили "+bonus+" монет");
  chest.style.display="none";
}

// Клик по золотому сундуку
gold.onclick=async()=>{
  const bonus=Math.floor(Math.random()*501)+500;
  await addCoins(bonus);
  alert("🌟 ЗОЛОТОЙ сундук! Вы получили "+bonus+" монет");
  gold.style.display="none";
}

// Лидерборд
leaderBtn.onclick=async()=>{
  const res=await fetch(server+"/leaderboard");
  const data=await res.json();
  leaderboard.innerText = data.leaderboard || "Пока нет игроков";
}
</script>
</body>
</html>
