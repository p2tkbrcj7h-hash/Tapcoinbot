<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin + Lucky Chest</title>
<style>
body{
  background:#1b1b2f;
  color:white;
  font-family:Arial;
  text-align:center;
  margin-top:20px;
}

#coins{
  font-size:35px;
  margin:20px;
}

.coin, .chest, .gold{
  width:170px;
  cursor:pointer;
  margin-top:20px;
  transition:0.2s;
  position: relative;
  z-index:1;
}

#game{
  display:none;
}

#ready{
  font-size:22px;
  color:#00ff00;
  margin:10px;
}

/* Анимация прыжка монеты */
@keyframes jump {
  0%   { transform: translateY(0) scale(1); }
  50%  { transform: translateY(-30px) scale(1.3); }
  100% { transform: translateY(0) scale(1); }
}
.coin.jump { animation: jump 0.3s ease; }

/* Анимация прыжка сундука */
@keyframes chestJump {
  0% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.1); }
  100% { transform: translateY(0) scale(1); }
}
.chest.jump, .gold.jump { animation: chestJump 0.5s ease; }

/* Анимация открытия сундука */
@keyframes chestOpen {
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(-90deg); }
  100% { transform: rotateX(0deg); }
}
.chest.open, .gold.open { animation: chestOpen 0.5s ease; }
</style>
</head>
<body>

<h1>🪙 Tap Coin + Lucky Chest</h1>
<div id="coins">0</div>

<!-- Монета -->
<img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">

<!-- Новый обычный сундук -->
<img id="chest" class="chest" src="/mnt/data/a_digital_illustration_in_fantasy_art_style_showca.png" style="display:none;">

<!-- Новый золотой сундук (можно использовать тот же) -->
<img id="gold" class="gold" src="/mnt/data/a_digital_illustration_in_fantasy_art_style_showca.png" style="display:none;">

<script>
const server="https://tap-coin-server.onrender.com";
let token=null;

const coinsDisplay=document.getElementById("coins");
const coin=document.querySelector(".coin");
const chest=document.getElementById("chest");
const gold=document.getElementById("gold");

// Добавление монет
async function addCoins(amount){
  if(!token) return;
  const res = await fetch(server+"/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({token, amount})
  });
  const data = await res.json();
  coinsDisplay.innerText=data.coins;
}

// Случайное появление сундука
function maybeChest(){
  if(Math.random() < 0.05 && chest.style.display==='none'){
    chest.style.display='block';
    chest.classList.add("jump");
    setTimeout(()=> chest.classList.remove("jump"),500);
  }
  if(Math.random() < 0.01 && gold.style.display==='none'){
    gold.style.display='block';
    gold.classList.add("jump");
    setTimeout(()=> gold.classList.remove("jump"),500);
  }
}

// Клик по монете
coin.onclick = async ()=>{
  if(!token) return alert("Сначала получите токен!");
  await addCoins(1);
  coin.classList.add("jump");
  setTimeout(()=> coin.classList.remove("jump"),300);
  maybeChest();
}

// Клик по обычному сундуку
chest.onclick = async ()=>{
  chest.classList.add("open");
  const bonus = Math.floor(Math.random()*231)+20; // 20-250 монет
  await addCoins(bonus);
  alert(`🎉 Вы получили ${bonus} монет из сундука!`);
  chest.style.display='none';
  chest.classList.remove("open");
}

// Клик по золотому сундуку
gold.onclick = async ()=>{
  gold.classList.add("open");
  const bonus = Math.floor(Math.random()*501)+500; // 500-1000 монет
  await addCoins(bonus);
  alert(`🌟 ЗОЛОТОЙ сундук! ${bonus} монет`);
  gold.style.display='none';
  gold.classList.remove("open");
}
</script>
</body>
</html>
