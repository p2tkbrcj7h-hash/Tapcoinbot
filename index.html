<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin + Lucky Chest</title>

<style>
body{
background:#1b1b2f;
color:white;
font-family:Arial;
text-align:center;
margin-top:40px;
}

#coins{
font-size:35px;
margin:20px;
}

.coin, .chest{
width:180px;
cursor:pointer;
transition:0.2s;
}

.coin:active, .chest:active{
transform: scale(1.3);
}

#chest{
margin-top:30px;
display:none;
}
</style>
</head>

<body>

<h1>🪙 Tap Coin</h1>

<div id="coins">0</div>

<img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">

<!-- Сундук -->
<img id="chest" class="chest" src="https://cdn-icons-png.flaticon.com/512/1046/1046750.png">

<script>
const serverUrl = "https://bot-game-1-686w.onrender.com";

// Генерация уникального игрока
let userId = localStorage.getItem("userId");
if(!userId){
    userId = (typeof Telegram !== "undefined" && Telegram.WebApp.initDataUnsafe?.user?.id) 
             ? Telegram.WebApp.initDataUnsafe.user.id.toString()
             : Math.random().toString(36).substring(2);
    localStorage.setItem("userId", userId);
}

const display = document.getElementById("coins");
const coin = document.querySelector(".coin");
const chest = document.getElementById("chest");

// Загрузка монет с сервера
async function loadCoins(){
    try {
        const res = await fetch(`${serverUrl}/coins?userId=${userId}`);
        const data = await res.json();
        display.innerText = data.coins;
    } catch(e){
        console.error("Не удалось загрузить монеты", e);
        display.innerText = "0";
    }
}

// Добавление монет на сервер
async function addCoins(amount){
    try {
        const res = await fetch(`${serverUrl}/add`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({userId, amount})
        });
        const data = await res.json();
        display.innerText = data.coins;
    } catch(e){
        console.error("Не удалось добавить монеты", e);
    }
}

// Клик по монете
coin.onclick = async () => {
    await addCoins(1);
    // Анимация монеты
    coin.style.transform = "scale(1.3)";
    setTimeout(()=>coin.style.transform="scale(1)",150);
    maybeShowChest();
}

// Рандомное появление сундука
function maybeShowChest(){
    if(Math.random() < 0.05){ // 5% шанс после клика
        chest.style.display = "block";
    }
}

// Клик по сундуку
chest.onclick = async () => {
    const bonus = Math.floor(Math.random()*10)+1; // 1-10 монет
    await addCoins(bonus);
    alert(`Вы получили ${bonus} монет из сундука!`);
    chest.style.display = "none";
}

loadCoins();
</script>

</body>
</html>
