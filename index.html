<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin + Lucky Chest + Leaderboard</title>
<style>
body{
  background:#1b1b2f;
  color:white;
  font-family:Arial;
  text-align:center;
  margin-top:20px;
}
#coins{font-size:35px;margin:20px;}
input{padding:6px;border-radius:5px;border:none;}
button{padding:6px 10px;border-radius:5px;border:none;background:#f0a500;font-weight:bold;cursor:pointer;margin:5px;}
#game{display:none;}
#ready{font-size:22px;color:#00ff00;margin:10px;}
.coin, .chest, .gold{width:170px;cursor:pointer;margin-top:20px;transition:0.2s;}
#leaderboard{margin-top:20px; text-align:left; max-width:300px; margin-left:auto;margin-right:auto;}
#leaderboard h2{margin-bottom:5px;}
@keyframes jump {0%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.3);}100%{transform:translateY(0) scale(1);}}
.coin.jump{animation:jump 0.3s ease;}
@keyframes chestJump{0%{transform:translateY(0);}50%{transform:translateY(-20px);}100%{transform:translateY(0);}}
.chest.jump, .gold.jump{animation:chestJump 0.5s ease;}
</style>
</head>
<body>

<h1>🪙 Tap Coin + Lucky Chest</h1>
<p>Ваш токен: <span id="token">нет</span></p>
<button id="getToken">Получить токен</button>
<br><br>
<input id="loadToken" placeholder="Вставьте токен">
<button id="loadBtn">Загрузить токен</button>
<br><br>
<button id="readyBtn">Готово</button>
<div id="ready"></div>

<div id="game">
  <div id="coins">0</div>
  <img class="coin" src="https://i.ibb.co/7rF2wLJ/coin.png">
  <img id="chest" class="chest" src="https://i.ibb.co/3kHzDRM/chest.png" style="display:none;">
  <img id="gold" class="gold" src="https://i.ibb.co/2S7P9Fj/gold-chest.png" style="display:none;">
  
  <div id="leaderboard">
    <h2>🏆 Лидерборд</h2>
    <ol id="topPlayers"></ol>
  </div>
</div>

<script>
const server="https://tap-coin-server.onrender.com";
let token=null;

const tokenText=document.getElementById("token");
const coins=document.getElementById("coins");
const coin=document.querySelector(".coin");
const chest=document.getElementById("chest");
const gold=document.getElementById("gold");
const game=document.getElementById("game");
const ready=document.getElementById("ready");
const topPlayers=document.getElementById("topPlayers");

// Получить токен
document.getElementById("getToken").onclick=async()=>{
  const newToken=Math.random().toString(36).substring(2,10);
  const res=await fetch(server+"/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token:newToken})
  });
  const data=await res.json();
  token=data.token;
  localStorage.setItem("token",token);
  tokenText.innerText=token;
  coins.innerText=data.coins;
  updateLeaderboard();
}

// Загрузить токен
document.getElementById("loadBtn").onclick=async()=>{
  const t=document.getElementById("loadToken").value.trim();
  if(!t) return alert("Введите токен");
  token=t;
  localStorage.setItem("token",token);
  tokenText.innerText=token;
  const res=await fetch(server+"/coins?token="+token);
  const data=await res.json();
  coins.innerText=data.coins;
  updateLeaderboard();
}

// Кнопка Готово
document.getElementById("readyBtn").onclick=()=>{
  if(!token){ alert("Сначала получите или загрузите токен!"); return;}
  ready.innerText="Готово ✅";
  game.style.display="block";
}

// Добавление монет
async function addCoins(amount){
  if(!token) return;
  const res=await fetch(server+"/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token,amount})
  });
  const data=await res.json();
  coins.innerText=data.coins;
  updateLeaderboard();
}

// Случайное появление сундука
function maybeChest(){
  if(Math.random()<0.05 && chest.style.display==='none'){
    chest.style.display='block';
    chest.classList.add("jump");
    setTimeout(()=>chest.classList.remove("jump"),500);
  }
  if(Math.random()<0.01 && gold.style.display==='none'){
    gold.style.display='block';
    gold.classList.add("jump");
    setTimeout(()=>gold.classList.remove("jump"),500);
  }
}

// Клик по монете
coin.onclick=async()=>{
  await addCoins(1);
  coin.classList.add("jump");
  setTimeout(()=>coin.classList.remove("jump"),300);
  maybeChest();
}

// Клик по обычному сундуку
chest.onclick=async()=>{
  const bonus=Math.floor(Math.random()*231)+20;
  await addCoins(bonus);
  alert("🎉 Вы получили "+bonus+" монет");
  chest.style.display='none';
}

// Клик по золотому сундуку
gold.onclick=async()=>{
  const bonus=Math.floor(Math.random()*501)+500;
  await addCoins(bonus);
  alert("🌟 ЗОЛОТОЙ сундук! "+bonus+" монет");
  gold.style.display='none';
}

// Получаем топ-5 игроков
async function updateLeaderboard(){
  try{
    const res=await fetch(server+"/leaderboard");
    const data=await res.json();
    topPlayers.innerHTML="";
    data.slice(0,5).forEach(user=>{
      const li=document.createElement("li");
      li.innerText=`${user.token} - ${user.coins} 💰`;
      topPlayers.appendChild(li);
    });
  }catch(e){
    console.error("Ошибка лидерборда:",e);
  }
}

// Обновление каждые 5 секунд
setInterval(updateLeaderboard,5000);

</script>
</body>
</html>
