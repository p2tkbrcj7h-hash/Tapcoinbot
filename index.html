<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin</title>
<style>
body{
  background:#1b1b2f;
  color:white;
  font-family:Arial;
  text-align:center;
  margin-top:20px;
}
#coins{font-size:35px;margin:20px;}
input{padding:6px;border-radius:5px;border:none;}
button{
  padding:6px 10px;
  border-radius:5px;
  border:none;
  background:#f0a500;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
}
.coin{
  width:170px;
  cursor:pointer;
  margin-top:20px;
}
#game{display:none;}
#ready{font-size:22px;color:#00ff00;margin:10px;}
</style>
</head>
<body>

<h1>🪙 Tap Coin</h1>

<p>Ваш токен: <span id="token">нет</span></p>
<button id="getToken">Получить токен</button><br><br>

<input id="loadToken" placeholder="Вставьте токен">
<button id="loadBtn">Загрузить токен</button><br><br>

<button id="readyBtn">Готово</button>
<div id="ready"></div>

<div id="game">
  <div id="coins">0</div>
  <img id="coin" class="coin" src="images/coin.png">
  <br>
  <button id="leaderboardBtn">Показать лидерборд</button>
</div>

<script>
const server="https://tap-coin-server.onrender.com"; // твой старый сервер.js
let token = null;

const tokenText = document.getElementById("token");
const coins = document.getElementById("coins");
const coin = document.getElementById("coin");
const game = document.getElementById("game");
const ready = document.getElementById("ready");
const leaderboardBtn = document.getElementById("leaderboardBtn");

// Генерация токена
document.getElementById("getToken").onclick = async () => {
  const newToken = Math.random().toString(36).substring(2,10);
  token = newToken;
  localStorage.setItem("token", token);
  tokenText.innerText = token;

  // Получаем текущие монеты
  const res = await fetch(server+"/coins?token="+token);
  const data = await res.json().catch(()=>({coins:0}));
  coins.innerText = data.coins || 0;
};

// Загрузка токена
document.getElementById("loadBtn").onclick = async () => {
  const t = document.getElementById("loadToken").value.trim();
  if(!t) return alert("Введите токен");
  token = t;
  localStorage.setItem("token", token);
  tokenText.innerText = token;

  const res = await fetch(server+"/coins?token="+token);
  const data = await res.json().catch(()=>({coins:0}));
  coins.innerText = data.coins || 0;
};

// Кнопка готово
document.getElementById("readyBtn").onclick = () => {
  if(!token){ alert("Сначала получите или загрузите токен!"); return; }
  ready.innerText = "Готово ✅";
  game.style.display = "block";
};

// Клик по монете
coin.onclick = async () => {
  if(!token) return alert("Сначала получите токен!");
  const res = await fetch(server+"/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({token, amount:1})
  });
  const data = await res.json();
  coins.innerText = data.coins;
};

// Лидерборд
leaderboardBtn.onclick = async () => {
  if(!token) return alert("Сначала получите токен!");
  const res = await fetch(server+"/leaderboard?token="+token);
  const data = await res.json();
  alert("🏆 Лидерборд:\n" + data.board);
};
</script>

</body>
</html>
