<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tap Coin Telegram Friendly</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background:#1b1b2f; color:white; font-family:Arial; text-align:center; margin-top:40px; }
#coins { font-size:35px; margin:20px; }
.coin { width:180px; cursor:pointer; transition:0.15s; }
.coin:active { transform:scale(1.2); }
button { font-size:20px; padding:10px 20px; margin:5px; cursor:pointer; }
</style>
</head>
<body>

<h1>🪙 Tap Coin</h1>
<div>Coins: <span id="coins">0</span>🪙</div>
<img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png" id="tapButton">

<h2>Shop</h2>
<button onclick="buy(2,10)">x2 Coins (10🪙)</button>
<button onclick="buy(10,30)">x10 Coins (30🪙)</button>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // Проверка Telegram WebApp
    if(window.Telegram){
        Telegram.WebApp.ready();
        var userId = Telegram.WebApp.initDataUnsafe.user.id;
    } else {
        var userId = "testUser"; // для браузера
    }

    // Инициализация монет
    let coins = Number(localStorage.getItem("coins_" + userId)) || 0;
    const display = document.getElementById('coins');

    function updateDisplay() {
        display.textContent = coins;
        localStorage.setItem("coins_" + userId, coins);
    }

    // Сразу отображаем текущее количество
    updateDisplay();

    // Клик на монету
    document.getElementById('tapButton').addEventListener("click", () => {
        coins += 1;
        updateDisplay();
    });

    // Магазин
    window.buy = (multiplier, cost) => {
        if(coins >= cost){
            coins -= cost;       // снимаем стоимость
            coins += multiplier; // добавляем бонус
            updateDisplay();
        } else {
            alert("Not enough coins!");
        }
    };

});
</script>

</body>
</html>
