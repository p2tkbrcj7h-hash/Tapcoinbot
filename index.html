<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin + Lucky Chest</title>
<style>
body{
  background:#1b1b2f;
  color:white;
  font-family:Arial;
  text-align:center;
  margin-top:20px;
}
#coins{font-size:35px;margin:20px;}
input, button{
  margin:5px;
  padding:5px 10px;
  border-radius:5px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button{background:#f0a500;color:black;}
.coin, .chest, .gold-chest{
  width:180px;
  cursor:pointer;
  transition:0.2s;
  margin-top:20px;
  display:block;
}
/* Анимация монеты */
@keyframes jump {0%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.3);}100%{transform:translateY(0) scale(1);}}
.coin.jump{animation:jump 0.3s ease;}
/* Анимация сундука */
@keyframes chestJump {0%{transform:translateY(0) scale(1);}50%{transform:translateY(-20px) scale(1.1);}100%{transform:translateY(0) scale(1);}}
.chest.jump,.gold-chest.jump{animation:chestJump 0.5s ease;}
#game {display:none;}
#readyMessage {color:#0f0;font-size:24px;margin:10px;}
</style>
</head>
<body>

<h1>🪙 Tap Coin + Lucky Chest</h1>

<p>Ваш токен: <span id="tokenDisplay">нет</span></p>
<button id="getToken">Получить токен</button>

<p>Загрузите сюда свой токен:</p>
<input id="loadToken" placeholder="Вставьте токен">
<button id="loadBtn">Загрузить токен</button>

<button id="readyBtn">Готово</button>
<p id="readyMessage"></p>

<div id="game">
  <div id="coins">0</div>
  <img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">
  <img id="chest" class="chest" src="https://cdn-icons-png.flaticon.com/512/833/833314.png" style="display:none;">
  <img id="goldChest" class="gold-chest" src="https://cdn-icons-png.flaticon.com/512/833/833310.png" style="display:none;">
</div>

<script>
const serverUrl = "https://tap-coin-server.onrender.com"; // твой сервер
let token = localStorage.getItem('token');
const display = document.getElementById('coins');
const coin = document.querySelector('.coin');
const chest = document.getElementById('chest');
const goldChest = document.getElementById('goldChest');
const tokenDisplay = document.getElementById('tokenDisplay');
const gameDiv = document.getElementById('game');
const readyMessage = document.getElementById('readyMessage');

// Регистрация / получение токена
async function register(newToken){
    const res = await fetch(`${serverUrl}/register`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ token: newToken })
    });
    const data = await res.json();
    token = data.token;
    localStorage.setItem('token', token);
    tokenDisplay.innerText = token;
    display.innerText = data.coins;
}

// Изначально проверяем токен
if(!token) register();
else tokenDisplay.innerText = token;

// Кнопки получения и загрузки токена
document.getElementById('getToken').onclick = () => register();
document.getElementById('loadBtn').onclick = async () => {
    const t = document.getElementById('loadToken').value.trim();
    if(!t) return alert("Введите токен");
    token = t;
    localStorage.setItem('token', token);
    tokenDisplay.innerText = token;
    const res = await fetch(`${serverUrl}/coins?token=${token}`);
    const data = await res.json();
    display.innerText = data.coins;
}

// Кнопка "Готово"
document.getElementById('readyBtn').onclick = () => {
    if(!token) return alert("Сначала получите или загрузите токен!");
    readyMessage.innerText = "Готово ✅";
    gameDiv.style.display = "block";
}

// Добавление монет
async function addCoins(amount){
    if(!token) return alert("Сначала получите токен!");
    const res = await fetch(`${serverUrl}/add`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ token, amount })
    });
    const data = await res.json();
    display.innerText = data.coins;
}

// Появление сундуков
function maybeShowChest(){
    if(Math.random() < 0.05 && chest.style.display==='none'){
        chest.style.display='block';
        chest.classList.add("jump");
        setTimeout(()=>chest.classList.remove("jump"),500);
    }
    if(Math.random() < 0.01 && goldChest.style.display==='none'){
        goldChest.style.display='block';
        goldChest.classList.add("jump");
        setTimeout(()=>goldChest.classList.remove("jump"),500);
    }
}

// Клик по монете
coin.onclick = async () => {
    await addCoins(1);
    coin.classList.add("jump");
    setTimeout(()=> coin.classList.remove("jump"),300);
    maybeShowChest();
}

// Клик по обычному сундуку
chest.onclick = async () => {
    const bonus = Math.floor(Math.random()*231) + 20;
    await addCoins(bonus);
    alert(`🎉 Поздравляем! Вы получили ${bonus} монет!`);
    chest.style.display='none';
}

// Клик по золотому сундуку
goldChest.onclick = async () => {
    const bonus = Math.floor(Math.random()*501) + 500;
    await addCoins(bonus);
    alert(`🌟 Вау! Вы нашли ЗОЛОТОЙ сундук и получили ${bonus} монет!`);
    goldChest.style.display='none';
}
</script>

</body>
</html>
