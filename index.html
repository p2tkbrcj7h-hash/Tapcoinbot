<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Coin</title>

<style>
body{
background:#1b1b2f;
color:white;
font-family:Arial;
text-align:center;
margin-top:40px;
}

#coins{
font-size:35px;
margin:20px;
}

.coin{
width:180px;
cursor:pointer;
transition:0.15s;
}

.coin:active{
transform:scale(1.2);
}
</style>
</head>

<body>

<h1>🪙 Tap Coin</h1>

<div id="coins">0</div>

<img class="coin" src="https://cdn-icons-png.flaticon.com/512/138/138292.png">

<script>

const serverUrl = "https://bot-game-1-686w.onrender.com";

let userId = localStorage.getItem("userId");

if(!userId){
userId = Math.random().toString(36).substring(2);
localStorage.setItem("userId", userId);
}

const display = document.getElementById("coins");
const coin = document.querySelector(".coin");

async function loadCoins(){
const res = await fetch(serverUrl + "/coins?userId=" + userId);
const data = await res.json();
display.innerText = data.coins;
}

async function tap(){
const res = await fetch(serverUrl + "/add",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
userId:userId,
amount:1
})
});

const data = await res.json();
display.innerText = data.coins;
}

coin.onclick = tap;

loadCoins();

</script>

</body>
</html>
